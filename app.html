<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Mohan Ceramics App</title>
        <meta name="description" content="Cerámica artesanal de Mohan Ceramics: catálogo de productos y estadísticas de ventas.">
        <link rel="stylesheet" href="appStyle.css">
        <script src="appScript.js" defer></script>

        <!-- Vincula la configuración PWA -->
        <link rel="manifest" href="manifest.json">

        <!-- Configuración especial obligatoria para iOS (Oculta barras) -->
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Mohan Ceramics">
        <link rel="apple-touch-icon" href="icon-192.png">
    </head>
    
    <body class="body">
        <h1 class="visually_hidden">Mohan Ceramics</h1>

        <!-- BARRA DE NAVEGACIÓN -->
        <footer id="container_background">
            <nav id="options_container" aria-label="Navegación principal">
                <span id="options_circle"></span>
                
                <button class="options_button" id="home_button" aria-label="Productos">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 48 48" id="home_icon" height="38" width="48"><g id="home-1--home-house-roof-shelter"><path id="Subtract" fill="#d1f0ff" fill-rule="evenodd" d="M20.5682 2.81246c2.1784 -0.99734 4.6852 -0.99734 6.8636 0 7.7657 3.5554 13.5513 8.64154 16.3373 11.38514 1.5022 1.4793 2.3049 3.4519 2.4175 5.4865 0.1388 2.5072 0.3134 6.5725 0.3134 11.1586 0 3.2363 -0.087 6.2126 -0.1868 8.5643 -0.1601 3.7688 -3.1695 6.7252 -6.9275 6.8541 -3.4773 0.1192 -8.6464 0.2389 -15.3857 0.2389s-11.9084 -0.1197 -15.38569 -0.2389c-3.75796 -0.1289 -6.76743 -3.0853 -6.92748 -6.8541C1.58696 37.0553 1.5 34.079 1.5 30.8427c0 -4.5861 0.17463 -8.6514 0.31339 -11.1586 0.1126 -2.0346 0.91528 -4.0072 2.41753 -5.4865C7.01693 11.454 12.8025 6.36786 20.5682 2.81246ZM16 36c-1.1046 0 -2 0.8954 -2 2s0.8954 2 2 2h16c1.1046 0 2 -0.8954 2 -2s-0.8954 -2 -2 -2H16Z" clip-rule="evenodd" stroke-width="1"></path></g></svg>
                </button>

                <button class="options_button" id="add_product" aria-label="Añadir producto">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14" class="options_icon" id="add_icon" height="14" width="14"><g id="add-1--expand-cross-buttons-button-more-remove-plus-add-+-mathematics-math"><path id="Union" fill="#d1f0ff" d="M8 1c0 -0.552285 -0.44772 -1 -1 -1S6 0.447715 6 1v5H1c-0.552285 0 -1 0.44772 -1 1s0.447715 1 1 1h5v5c0 0.5523 0.44772 1 1 1s1 -0.4477 1 -1V8h5c0.5523 0 1 -0.44772 1 -1s-0.4477 -1 -1 -1H8V1Z" clip-rule="evenodd" stroke-width="1"></path></g></svg>
                </button>
                
                <button class="options_button" id="stats_button" aria-label="Estadísticas">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14" class="options_icon" id="stats_icon" height="14" width="14"><g id="signal-medium--smartphone-phone-mobile-device-iphone-signal-medium-wireless-bar-bars-android"><path id="Union" fill="#d1f0ff" fill-rule="evenodd" d="M8.33124 5H5.66876c-0.27614 0 -0.5 0.22386 -0.5 0.5v8c0 0.2761 0.22386 0.5 0.5 0.5h2.66248c0.27614 0 0.5 -0.2239 0.5 -0.5v-8c0 -0.27614 -0.22386 -0.5 -0.5 -0.5ZM3.16247 8H0.5c-0.276142 0 -0.5 0.22386 -0.5 0.5v5c0 0.2761 0.223857 0.5 0.5 0.5h2.66247c0.27615 0 0.5 -0.2239 0.5 -0.5v-5c0 -0.27614 -0.22385 -0.5 -0.5 -0.5Zm7.70373 4.5c-0.4142 0 -0.75 0.3358 -0.75 0.75s0.3358 0.75 0.75 0.75h2.3749c0.4142 0 0.75 -0.3358 0.75 -0.75s-0.3358 -0.75 -0.75 -0.75h-2.3749Z" clip-rule="evenodd" stroke-width="1"></path></g></svg>
                </button>
            </nav>
        </footer>

        <!-- PÁGINAS PRINCIPALES (se cambian deslizando) -->
        <main id="swipe_container">
            <section class="page" id="home">
                <h2 class="visually_hidden">Productos</h2>
                <section id="product_scroller"></section>
                <section id="product_grid"></section>
            </section>

            <section class="page" id="stats">
                <section id="stats_content">
                    <h2 class="stats_title">Estadísticas</h2>

                    <!-- Dinero ganado: este mes + scroll horizontal con el resto -->
                    <article class="stat_card" id="money_card">
                        <header class="stat_header">
                            <h3>Dinero ganado</h3>
                        </header>
                        <ul id="money_scroller"></ul>
                    </article>

                    <article class="stat_card">
                        <header class="stat_header">
                            <h3>Ventas este mes</h3>
                            <p class="stat_total" id="sales_total"></p>
                        </header>
                        <figure class="chart" id="sales_chart"></figure>
                    </article>

                    <article class="stat_card">
                        <header class="stat_header">
                            <h3>Visitas a la web este mes</h3>
                            <p class="stat_total" id="views_total"></p>
                        </header>
                        <figure class="chart" id="views_chart"></figure>
                    </article>

                    <article class="stat_card">
                        <header class="stat_header">
                            <h3>Ventas por mes</h3>
                            <p class="stat_total" id="year_total"></p>
                        </header>
                        <figure class="chart" id="months_chart"></figure>
                    </article>
                </section>
            </section>
        </main>

        <!-- CREAR / EDITAR PRODUCTO -->
        <section class="floating_window" id="product_creator" role="dialog" aria-modal="true" aria-labelledby="creator_title">
            <button class="close_button" id="close_creator" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="close_creator_icon"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Menu / Close_SM"> <path id="Vector" d="M16 16L12 12M12 12L8 8M12 12L16 8M12 12L8 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g> </g></svg>
            </button>

            <form class="window_content" id="creator_form" novalidate>
                <h2 class="window_title" id="creator_title">Nuevo producto</h2>

                <fieldset class="field_group">
                    <legend class="field_label">Imágenes</legend>
                    <ul id="image_previews">
                        <li class="add_image_tile" id="add_image_tile">
                            <label for="image_input" aria-label="Añadir imagen">+</label>
                        </li>
                    </ul>
                </fieldset>
                <input type="file" id="image_input" accept="image/*" multiple hidden>

                <label class="field_label" for="title_input">Título</label>
                <input type="text" id="title_input" class="text_input" maxlength="60" placeholder="Ej: Jarrón de arcilla" autocomplete="off">

                <label class="field_label" for="tag_input">Etiquetas</label>
                <span class="tag_row">
                    <input type="text" id="tag_input" class="text_input" maxlength="24" placeholder="Escribe y pulsa añadir" autocomplete="off">
                    <button type="button" id="add_tag_button" class="secondary_button">Añadir</button>
                </span>
                <ul id="tag_list" class="tag_list"></ul>

                <p id="creator_error" class="error_text" role="alert"></p>

                <button type="submit" id="save_product" class="primary_button">Guardar producto</button>
            </form>
        </section>

        <!-- VISTA DE PRODUCTO -->
        <section class="floating_window" id="close_view" role="dialog" aria-modal="true" aria-labelledby="detail_title">
            <button class="close_button" id="close_close_view" aria-label="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="close_creator_icon"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Menu / Close_SM"> <path id="Vector" d="M16 16L12 12M12 12L8 8M12 12L16 8M12 12L8 16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g> </g></svg>
            </button>

            <article class="window_content" id="detail_content">
                <section id="detail_gallery" aria-label="Imágenes del producto"></section>
                <h2 class="window_title" id="detail_title"></h2>
                <ul id="detail_tags" class="tag_list"></ul>

                <footer class="detail_actions">
                    <button type="button" id="edit_product" class="primary_button">Editar</button>
                    <button type="button" id="delete_product" class="danger_button">Borrar</button>
                </footer>
            </article>
        </section>
    </body>
</html>
